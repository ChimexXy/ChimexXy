<svg width="100%" viewBox="0 0 1200 300" role="img" xmlns="http://www.w3.org/2000/svg">
<title>ChimexXy electric terminal banner</title>
<desc>A dark cyberpunk banner with a glowing terminal window, neon ChimexXy name, and animated circuit traces.</desc>
<defs>
<linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
<stop offset="0" stop-color="#00f0ff"/>
<stop offset="0.55" stop-color="#5ad1ff"/>
<stop offset="1" stop-color="#ff2bd6"/>
</linearGradient>
<filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
<feGaussianBlur stdDeviation="7" result="b"/>
<feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
<pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
<path d="M42 0H0V42" fill="none" stroke="#1bd5ff" stroke-width="0.6" opacity="0.06"/>
</pattern>
</defs>

<rect x="0" y="0" width="1200" height="300" rx="16" fill="#070b14"/>
<rect x="0" y="0" width="1200" height="300" rx="16" fill="url(#grid)"/>

<polyline points="0,40 120,40 150,70 360,70" fill="none" stroke="#00f0ff" stroke-width="1.4" opacity="0.5" stroke-dasharray="6 10">
<animate attributeName="stroke-dashoffset" values="160;0" dur="3s" repeatCount="indefinite"/>
</polyline>
<polyline points="1200,260 1080,260 1050,230 760,230" fill="none" stroke="#ff2bd6" stroke-width="1.4" opacity="0.45" stroke-dasharray="6 10">
<animate attributeName="stroke-dashoffset" values="0;160" dur="3.4s" repeatCount="indefinite"/>
</polyline>
<polyline points="1200,70 1110,70 1085,95 980,95" fill="none" stroke="#00f0ff" stroke-width="1.2" opacity="0.4" stroke-dasharray="4 9">
<animate attributeName="stroke-dashoffset" values="120;0" dur="2.6s" repeatCount="indefinite"/>
</polyline>
<circle cx="360" cy="70" r="3.5" fill="#00f0ff"><animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite"/></circle>
<circle cx="760" cy="230" r="3.5" fill="#ff2bd6"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.4s" repeatCount="indefinite"/></circle>
<circle cx="980" cy="95" r="3" fill="#00f0ff"><animate attributeName="opacity" values="0.3;1;0.3" dur="1.8s" repeatCount="indefinite"/></circle>

<rect x="60" y="62" width="500" height="186" rx="12" fill="#0b1322" stroke="#16e0ff" stroke-width="1.3" opacity="0.95"/>
<rect x="60" y="62" width="500" height="186" rx="12" fill="none" stroke="#00f0ff" stroke-width="0.6" opacity="0.3">
<animate attributeName="opacity" values="0.15;0.4;0.15" dur="2.8s" repeatCount="indefinite"/>
</rect>
<circle cx="86" cy="86" r="6" fill="#ff5f56"/>
<circle cx="108" cy="86" r="6" fill="#ffbd2e"/>
<circle cx="130" cy="86" r="6" fill="#27c93f"/>
<text x="160" y="91" font-family="monospace" font-size="13" fill="#7d8ba8">chimex@1337: ~/career</text>
<line x1="60" y1="104" x2="560" y2="104" stroke="#1c2942" stroke-width="1"/>

<text x="84" y="134" font-family="monospace" font-size="15" fill="#00f0ff">$ <tspan fill="#cfe8ff">whoami</tspan></text>
<text x="84" y="160" font-family="monospace" font-size="15" fill="#e6f5ff">ChimexXy — systems dev @ 1337</text>
<text x="84" y="186" font-family="monospace" font-size="15" fill="#00f0ff">$ <tspan fill="#cfe8ff">stack --list</tspan></text>
<text x="84" y="212" font-family="monospace" font-size="15" fill="#39ff8a">C · C++ · Go · Python · Docker</text>
<text x="84" y="238" font-family="monospace" font-size="15" fill="#00f0ff">$ <tspan fill="#cfe8ff">./hire_me --status open</tspan></text>
<rect x="376" y="227" width="9" height="15" fill="#39ff8a">
<animate attributeName="opacity" values="1;1;0;0" dur="1.1s" repeatCount="indefinite"/>
</rect>

<text x="855" y="100" font-family="monospace" font-size="15" fill="#39ff8a" text-anchor="middle" opacity="0.85">// 42 Network · Tetouan, MA</text>

<text x="855" y="172" font-family="Verdana, sans-serif" font-size="74" font-weight="bold" fill="#00f0ff" text-anchor="middle" filter="url(#glow)" opacity="0.55">ChimexXy
<animate attributeName="opacity" values="0.35;0.7;0.35" dur="2.6s" repeatCount="indefinite"/>
</text>
<text x="855" y="172" font-family="Verdana, sans-serif" font-size="74" font-weight="bold" fill="url(#neon)" text-anchor="middle">ChimexXy</text>

<text x="855" y="212" font-family="monospace" font-size="19" fill="#6fd3ff" text-anchor="middle" letter-spacing="3">C &#160;•&#160; C++ &#160;•&#160; Go &#160;•&#160; Python</text>
</svg>
