name: Generate Snake

on:
  schedule:
    - cron: "0 */12 * * *"   # rebuild twice a day
  workflow_dispatch:          # lets you run it manually
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generate snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=#00f0ff&color_dots=#0b1322,#164a5c,#1b8ca6,#39ff8a,#ff2bd6
            dist/snake-light.svg?color_snake=#00f0ff&color_dots=#ebedf0,#9be9ff,#39d3ff,#00b8d4,#ff2bd6

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}