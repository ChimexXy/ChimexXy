name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ChimexXy
          github_token: ${{ secrets.GITHUB_TOKEN }}
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=#00f0ff&color_dots=#0b1322,#164a5c,#1b8ca6,#39ff8a,#ff2bd6
            dist/snake-light.svg?color_snake=#00f0ff&color_dots=#ebedf0,#9be9ff,#39d3ff,#00b8d4,#ff2bd6

      - name: Push to output branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan output
          git rm -rf .
          cp -r dist/* .
          git add .
          git commit -m "Update snake SVGs"
          git push origin output --force
